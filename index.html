  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --ink:#0A0A0A;
    --ink-soft:#6E6E6E;
    --line:#E3E1DA;
    --coral:#EB5B4F;
    --radius:0px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--coral); color:#fff;}

  header{
    position:sticky; top:0; z-index:50;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1180px; margin:0 auto; padding:22px 24px 14px;
  }

  }
  .hero-brand{
    text-align:center;
    padding:6px 0 18px;
  }
  .hero-brand img{
    height:34px;
    width:auto;
    display:block;
    margin:0 auto 10px;
  }
  .hero-brand h1{
    font-family:'Concasse', sans-serif;
    font-weight:900;
    font-size:clamp(38px, 7vw, 64px);
    letter-spacing:.02em;
    text-transform:uppercase;
    color:var(--ink);
    margin:0;
    line-height:1;
  }
  .hero-brand .rule{
    width:52px;
    height:3px;
    background:var(--coral);
    margin:14px auto 0;
  }
  .yt-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:8px 14px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    border-radius:20px;
    text-decoration:none;
    transition:all .15s ease;
  }
  .yt-btn:hover{
    border-color:#FF0000;
    color:#FF0000;
  }
  .yt-btn svg{flex:0 0 auto;}
  .brandrow{
    display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;
  }
  .wordmark{
    display:flex; align-items:center; gap:12px;
  }
  .wordmark img{
    height:38px;
    width:auto;
    display:block;
  }
  .wordmark span{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--coral);
    border:1px solid var(--coral);
    padding:3px 7px;
    border-radius:2px;
    align-self:center;
  }
  .stats{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.03em;
  }
  .stats b{color:var(--ink); font-weight:600;}

  .controls{
    display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center;
  }
  #search{
    flex:1; min-width:180px;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    padding:10px 14px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    border-radius:var(--radius);
    outline:none;
  }
  #search:focus{border-color:var(--coral);}
  .chips{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-top:12px;
    scrollbar-width:thin;
  }
  .chip{
    flex:0 0 auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    font-weight:500;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:7px 12px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--coral);}
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  .hero{
    max-width:1180px; margin:0 auto; padding:40px 24px 8px;
  }
  .hero h1{
    font-family:'Concasse', sans-serif;
    font-weight:300;
    font-size:clamp(24px, 3.4vw, 34px);
    line-height:1.3;
    max-width:760px;
    margin:0 0 4px;
    color:var(--ink);
  }
  .hero p{
    font-size:14px;
    color:var(--ink-soft);
    max-width:600px;
    margin:0;
  }

  .quote-banner{
    max-width:1180px; margin:28px auto 8px; padding:0 24px;
    display:flex; justify-content:center;
  }
  .quote-banner figure{
    margin:0;
    width:100%;
    border:1px solid var(--line);
    background:#0A0A0A;
  }
  .quote-banner img{
    width:100%; height:auto;
    display:block;
  }

  main{max-width:1180px; margin:0 auto; padding:24px 24px 80px;}
  #count-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    grid-auto-flow: dense;
    gap:16px;
  }
  .editorial{
    grid-column: span 2;
    grid-row: span 2;
    position:relative;
    overflow:hidden;
    border-radius:var(--radius);
    background:#0A0A0A;
    min-height:620px;
    display:flex;
    align-items:flex-end;
  }
  .editorial img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .editorial video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#0A0A0A;
  }
  .editorial .editorial-tag{
    position:relative;
    z-index:2;
    margin:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#fff;
    background:var(--coral);
    padding:5px 10px;
    align-self:flex-start;
  }
  @media (max-width:640px){
    .editorial{ grid-column: span 1; grid-row: span 1; min-height:440px; }
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(34,48,31,.08);
    border-color:var(--coral);
  }
  .card-img{
    width:100%; height:150px;
    object-fit:cover;
    display:block;
    background:#F0EFEA;
    border-bottom:1px solid var(--line);
  }
  .card-img.placeholder{
    display:flex; align-items:center; justify-content:center;
    font-family:'Concasse', sans-serif;
    font-weight:300;
    letter-spacing:.04em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--ink-soft);
  }
  .card-body{
    padding:16px 18px 18px;
    display:flex; flex-direction:column; gap:9px; flex:1;
  }
  .card-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--coral);
  }
  .card h3{
    font-family:'Concasse', sans-serif;
    font-weight:700;
    font-size:18px;
    line-height:1.25;
    margin:0;
    color:var(--ink);
  }
  .card-meta{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .nutri{
    margin-top:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.02em;
    color:var(--ink);
    border-top:1px dashed var(--line);
    padding-top:8px;
  }
  .play-badge{
    position:absolute; top:10px; right:10px;
    background:rgba(34,48,31,.75);
    color:#fff;
    width:30px; height:30px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    pointer-events:none;
  }
  .card{position:relative;}
  .video-embed{
    width:100%; aspect-ratio:9/16; max-height:480px;
    border:none; display:block; background:#000;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(34,48,31,.55);
    display:none; align-items:flex-start; justify-content:center;
    padding:5vh 16px; overflow-y:auto; z-index:100;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface);
    max-width:600px; width:100%;
    border-radius:var(--radius);
    overflow:hidden;
    position:relative;
    animation:rise .18s ease;
  }
  @keyframes rise{from{transform:translateY(10px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-img{
    width:100%; height:240px; object-fit:cover; display:block;
    background:#F0EFEA;
  }
  .modal-body{padding:26px 30px 30px;}
  .modal .close{
    position:absolute; top:14px; right:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink);
    background:rgba(255,255,255,.85); border:1px solid var(--line);
    width:30px; height:30px; border-radius:50%;
    cursor:pointer;
  }
  .modal .card-eyebrow{margin-bottom:6px;}
  .modal h2{
    font-family:'Concasse', sans-serif;
    font-weight:700;
    font-size:clamp(24px,4vw,30px);
    margin:0 0 4px;
    line-height:1.15;
  }
  .modal .fecha{font-size:12.5px; color:var(--ink-soft); margin-bottom:20px;}
  .modal h4{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--coral);
    margin:22px 0 10px;
  }
  .modal ul{margin:0; padding-left:18px;}
  .modal ul li{margin-bottom:6px; font-size:14.5px; line-height:1.5;}
  .modal ol{margin:0; padding-left:20px;}
  .modal ol li{margin-bottom:9px; font-size:14.5px; line-height:1.55;}
  .modal .nutribox{
    margin-top:22px;
    border-left:3px solid var(--coral);
    padding:12px 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink);
    background:#FAF9F7;
  }

  footer{
    text-align:center; padding:30px 20px 50px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--ink-soft);
  }
  .pattern-strip.footer-strip{
    opacity:.35;
    margin-bottom:8px;
  }

  @media (max-width:600px){
    .modal-body{padding:22px 20px 24px;}
  }
</style>
</head>

const grid = document.getElementById('grid');
const chipsEl = document.getElementById('chips');
const searchEl = document.getElementById('search');
const countLine = document.getElementById('count-line');
const statsLine = document.getElementById('stats-line');
const overlay = document.getElementById('overlay');
const modalContent = document.getElementById('modal-content');

let activeCat = 'Todas';

const categorias = ['Todas', ...Array.from(new Set(RECETAS.map(r=>r.categoria))).sort()];

function buildChips(){
  chipsEl.innerHTML = '';
  categorias.forEach(cat=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (cat===activeCat ? ' active' : '');
    const count = cat==='Todas' ? RECETAS.length : RECETAS.filter(r=>r.categoria===cat).length;
    chip.textContent = cat + ' (' + count + ')';
    chip.onclick = ()=>{
      activeCat = cat;
      buildChips();
      render();
      const heroBlock = document.getElementById('hero-block');
      const quoteBlock = document.getElementById('quote-banner-block');
      if(cat === 'Todas'){
        if(heroBlock) heroBlock.style.display = '';
        if(quoteBlock) quoteBlock.style.display = '';
        window.scrollTo({top:0, behavior:'smooth'});
      } else {
        if(heroBlock) heroBlock.style.display = 'none';
        if(quoteBlock) quoteBlock.style.display = 'none';
        const mainEl = document.querySelector('main');
        if(mainEl) mainEl.scrollIntoView({behavior:'smooth', block:'start'});
      }
    };
    chipsEl.appendChild(chip);
  });
}

const EDITORIAL = [{"type": "image", "src": "images/editorial_1.jpg"}, {"type": "image", "src": "images/editorial_2.jpg"}, {"type": "image", "src": "images/editorial_3.jpg"}, {"type": "video", "src": "videos/video1.mp4"}, {"type": "video", "src": "videos/video2.mp4"}, {"type": "video", "src": "videos/video3.mp4"}];

function matches(r, q){
  if(activeCat!=='Todas' && r.categoria!==activeCat) return false;
  if(!q) return true;
  const hay = (r.titulo+' '+r.producto+' '+r.ingredientes.join(' ')).toLowerCase();
  return hay.includes(q.toLowerCase());
}

function render(){
  const q = searchEl.value.trim();
  const items = RECETAS.filter(r=>matches(r,q));
  countLine.textContent = items.length + ' receta' + (items.length===1?'':'s');
  grid.innerHTML = '';
  const showEditorial = (activeCat === 'Todas' && !q);
  const editorialEvery = 15; // insertar un bloque editorial cada 15 recetas
  let editorialIdx = 0;
  items.forEach((r, i)=>{
    if(showEditorial && i>0 && i % editorialEvery === 0 && editorialIdx < EDITORIAL.length){
      grid.appendChild(buildEditorialBlock(EDITORIAL[editorialIdx]));
      editorialIdx++;
    }
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = ()=>openModal(r);
    const imgHtml = r.portada_b64
      ? `<img class="card-img" src="${r.portada_b64}" alt="${r.titulo}">`
      : `<div class="card-img placeholder">Bocado</div>`;
    const SHOW_VIDEOS = false; // videos de YouTube desactivados temporalmente (IDs sin verificar)
    const playBadge = (SHOW_VIDEOS && r.video_id) ? `<div class="play-badge">▶</div>` : '';
    const nutri = r.nutricion ? r.nutricion : 'Ver receta completa →';
    card.innerHTML = `
      ${imgHtml}
      ${playBadge}
      <div class="card-body">
        <div class="card-eyebrow">${r.categoria}</div>
        <h3>${r.titulo}</h3>
        <div class="card-meta">${r.producto}</div>
        <div class="nutri">${nutri}</div>
      </div>
    `;
    grid.appendChild(card);
  });
  statsLine.innerHTML = '<b>'+RECETAS.length+'</b> recetas';
}

function buildEditorialBlock(block){
  const div = document.createElement('div');
  div.className = 'editorial';
  const mediaHtml = block.type === 'video'
    ? `<video src="${block.src}" autoplay muted loop playsinline></video>`
    : `<img src="${block.src}" alt="">`;
  div.innerHTML = `${mediaHtml}<div class="editorial-tag">Bocado Tips</div>`;
  return div;
}


function openModal(r){
  const SHOW_VIDEOS = false; // videos de YouTube desactivados temporalmente (IDs sin verificar)
  const mediaHtml = (SHOW_VIDEOS && r.video_id)
    ? `<iframe class="video-embed" src="https://www.youtube.com/embed/${r.video_id}" title="${r.titulo}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
    : (r.portada_b64 ? `<img class="modal-img" src="${r.portada_b64}" alt="${r.titulo}">` : '');
  modalContent.innerHTML = `
    <button class="close" onclick="closeModal()">✕</button>
    ${mediaHtml}
    <div class="modal-body">
      <div class="card-eyebrow">${r.categoria} · ${r.producto}</div>
      <h2>${r.titulo}</h2>
      <h4>Ingredientes</h4>
      <ul>${r.ingredientes.map(i=>'<li>'+i+'</li>').join('')}</ul>
      <h4>Preparación</h4>
      <ol>${r.preparacion.map(p=>'<li>'+p+'</li>').join('')}</ol>
      ${r.nutricion ? '<div class="nutribox">'+r.nutricion+'</div>' : ''}
    </div>
  `;
  overlay.classList.add('open');
}
function closeModal(){ overlay.classList.remove('open'); }
overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

searchEl.addEventListener('input', render);

buildChips();
render();
</script>
